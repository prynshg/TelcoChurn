<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Predictor</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background: #333; color: white; border: none; cursor: pointer; }
        h3 { margin-top: 24px; color: #b00; }
    </style>
</head>
<body>
    <h2>Customer Churn Predictor</h2>
    <form action="/predict-form" method="post">

        <label>Gender
            <select name="gender">
                <option>Male</option>
                <option>Female</option>
            </select>
        </label>

        <label>Senior Citizen
            <select name="SeniorCitizen">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </label>

        <label>Partner
            <select name="Partner">
                <option>Yes</option>
                <option>No</option>
            </select>
        </label>

        <label>Dependents
            <select name="Dependents">
                <option>Yes</option>
                <option>No</option>
            </select>
        </label>

        <label>Tenure (months)
            <input type="number" name="tenure" required>
        </label>

        <label>Phone Service
            <select name="PhoneService">
                <option>Yes</option>
                <option>No</option>
            </select>
        </label>

        <label>Multiple Lines
            <select name="MultipleLines">
                <option>No</option>
                <option>Yes</option>
                <option>No phone service</option>
            </select>
        </label>

        <label>Internet Service
            <select name="InternetService">
                <option>Fiber optic</option>
                <option>DSL</option>
                <option>No</option>
            </select>
        </label>

        <label>Online Security
            <select name="OnlineSecurity">
                <option>No</option>
                <option>Yes</option>
                <option>No internet service</option>
            </select>
        </label>

        <label>Online Backup
            <select name="OnlineBackup">
                <option>No</option>
                <option>Yes</option>
                <option>No internet service</option>
            </select>
        </label>

        <label>Device Protection
            <select name="DeviceProtection">
                <option>No</option>
                <option>Yes</option>
                <option>No internet service</option>
            </select>
        </label>

        <label>Tech Support
            <select name="TechSupport">
                <option>No</option>
                <option>Yes</option>
                <option>No internet service</option>
            </select>
        </label>

        <label>Streaming TV
            <select name="StreamingTV">
                <option>No</option>
                <option>Yes</option>
                <option>No internet service</option>
            </select>
        </label>

        <label>Streaming Movies
            <select name="StreamingMovies">
                <option>No</option>
                <option>Yes</option>
                <option>No internet service</option>
            </select>
        </label>

        <label>Contract
            <select name="Contract">
                <option>Month-to-month</option>
                <option>One year</option>
                <option>Two year</option>
            </select>
        </label>

        <label>Paperless Billing
            <select name="PaperlessBilling">
                <option>Yes</option>
                <option>No</option>
            </select>
        </label>

        <label>Payment Method
            <select name="PaymentMethod">
                <option>Electronic check</option>
                <option>Mailed check</option>
                <option>Bank transfer (automatic)</option>
                <option>Credit card (automatic)</option>
            </select>
        </label>

        <label>Monthly Charges
            <input type="number" step="0.01" name="MonthlyCharges" required>
        </label>

        <label>Total Charges
            <input type="number" step="0.01" name="TotalCharges" required>
        </label>

        <button type="submit">Predict</button>
    </form>

    {% if result is not none %}
        <h3>Churn Probability: {{ result }}</h3>
    {% endif %}
</body>
</html>
